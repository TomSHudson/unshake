[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "unshake"
version = "0.0.1"
description = "Full waveform seismic source inversion (moment tensors, directivity, distributed sources)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tom Hudson", email = "thomas.hudson@eaps.ethz.ch" }]
keywords = ["seismology", "inversion", "moment tensor", "full waveform", "source", "directivity"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/TomSHudson/unshake"
